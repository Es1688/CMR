<script>
(function () {
  'use strict';

  var state = { clients: [], categories: [], statuses: [] };
  var commentsClientId = null;
  var searchTimer = null;
  var toastTimer = null;

  /* ---------- Малые утилиты ---------- */

  function $(id) { return document.getElementById(id); }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  /** Вызов серверной функции Apps Script, возвращающий Promise. */
  function callServer(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          reject(err instanceof Error ? err : new Error(err && err.message ? err.message : String(err)));
        });
      runner[fn].apply(runner, args);
    });
  }

  function toast(message, type) {
    var el = $('toast');
    el.textContent = message;
    el.className = 'toast show' + (type === 'ok' ? ' toast-ok' : type === 'error' ? ' toast-error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 3500);
  }

  function showEmpty(html) {
    $('empty').innerHTML = html;
    $('empty').classList.remove('hidden');
  }

  function hideEmpty() {
    $('empty').classList.add('hidden');
  }

  /* ---------- Загрузка данных ---------- */

  function reload() {
    return Promise.all([callServer('getClients'), callServer('getSettings')]).then(function (res) {
      state.clients = res[0] || [];
      state.categories = (res[1] && res[1].categories) || [];
      state.statuses = (res[1] && res[1].statuses) || [];
      fillFilterSelects();
      renderCards();
    });
  }

  /* ---------- Список клиентов ---------- */

  function visibleClients() {
    var q = $('search').value.trim().toLowerCase();
    var category = $('filter-category').value;
    var status = $('filter-status').value;
    var list = state.clients.filter(function (c) {
      if (category && c.category !== category) return false;
      if (status && c.status !== status) return false;
      if (q) {
        var haystack = [c.name, c.igUsername, c.bio, c.phone, c.email, c.city, c.notes, c.category, c.status,
          c.likeLevel, c.sessionMoney, c.tattooCount]
          .join(' ').toLowerCase();
        if (haystack.indexOf(q) === -1) return false;
      }
      return true;
    });
    list.sort(function (a, b) { return String(b.created).localeCompare(String(a.created)); });
    return list;
  }

  function renderCards() {
    var list = visibleClients();
    var cards = $('cards');

    var badge = $('count-badge');
    badge.textContent = String(state.clients.length);
    badge.classList.remove('hidden');

    if (!state.clients.length) {
      cards.innerHTML = '';
      showEmpty(
        '<div class="empty-icon"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>' +
        'Пока нет ни одного клиента.<br>Нажмите «Добавить», чтобы создать первого.'
      );
      return;
    }
    if (!list.length) {
      cards.innerHTML = '';
      showEmpty('По вашему запросу и фильтрам ничего не найдено.<br>Измените запрос или сбросьте фильтры.');
      return;
    }
    hideEmpty();
    cards.innerHTML = list.map(cardHtml).join('');
  }

  function cardHtml(c) {
    var displayName = c.name || (c.igUsername ? '@' + c.igUsername : 'Без имени');
    var letterSource = (c.name || c.igUsername || '?').trim();

    var nick = '';
    if (c.igUsername) {
      var href = c.igLink || ('https://www.instagram.com/' + c.igUsername + '/');
      nick = '<a class="card-nick" href="' + esc(href) + '" target="_blank" rel="noopener">@' + esc(c.igUsername) + '</a>';
    }

    var meta = [];
    if (c.category) meta.push(esc(c.category));
    if (c.city) meta.push(esc(c.city));
    if (c.phone) meta.push('<a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>');
    var metaHtml = meta.length
      ? '<div class="card-meta">' + meta.join('<span class="dot">·</span>') + '</div>'
      : '';

    var badgeHtml = c.status
      ? '<span class="badge badge-' + statusClass(c.status) + '">' + esc(c.status) + '</span>'
      : '';

    var stats = [];
    if (c.likeLevel) stats.push('<span class="star">★</span>' + esc(c.likeLevel));
    if (c.sessionMoney) stats.push('<span class="money">~' + formatMoney(c.sessionMoney) + '</span>');
    if (c.tattooCount) stats.push('<span class="tattoos">' + esc(c.tattooCount) + ' тату</span>');
    var statsHtml = stats.length
      ? '<div class="card-stats">' + stats.join('<span class="dot">·</span>') + '</div>'
      : '';

    return '' +
      '<article class="card" data-id="' + esc(c.id) + '">' +
        '<div class="card-top">' +
          avatarHtml(letterSource, c.avatar) +
          '<div class="card-title">' +
            '<div class="card-name">' + esc(displayName) + '</div>' +
            nick +
          '</div>' +
          badgeHtml +
        '</div>' +
        metaHtml +
        statsHtml +
        (c.created ? '<div class="card-date">Добавлен: ' + esc(c.created) + '</div>' : '') +
      '</article>';
  }

  /** «5000» -> «5 000 ₽»; нечисловое значение показываем как есть. */
  function formatMoney(value) {
    var num = Number(String(value).replace(/\s/g, '').replace(',', '.'));
    if (!isFinite(num) || String(value).trim() === '') return esc(value) + ' ₽';
    return num.toLocaleString('ru-RU') + ' ₽';
  }

  function avatarHtml(letterSource, url) {
    var letter = (letterSource || '?').charAt(0).toUpperCase();
    var img = url ? '<img src="' + esc(url) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
    return '<div class="avatar" data-letter="' + esc(letter) + '">' + img + '</div>';
  }

  /** Цвет бейджа: известные статусы — фиксированный цвет, пользовательские — по хешу. */
  function statusClass(status) {
    var known = { 'Новый': 'blue', 'В работе': 'amber', 'Ожидание': 'violet', 'Сделка': 'green', 'Отказ': 'gray' };
    if (known[status]) return known[status];
    var palette = ['blue', 'amber', 'violet', 'green', 'gray'];
    var sum = 0;
    for (var i = 0; i < status.length; i++) sum += status.charCodeAt(i);
    return palette[sum % palette.length];
  }

  function onCardsClick(e) {
    if (e.target.closest('a')) return; // клик по нику/телефону — не открываем карточку
    var card = e.target.closest('.card');
    if (!card) return;
    var id = card.getAttribute('data-id');
    var client = state.clients.filter(function (c) { return c.id === id; })[0];
    if (client) openClientModal(client);
  }

  /* ---------- Селекты ---------- */

  /**
   * Заполняет select значениями. current — какое значение выбрать;
   * extra — значение (например, текущая категория клиента), которого нет
   * в настройках, чтобы не потерять его молча.
   */
  function fillSelect(select, options, placeholder, current, extra) {
    var values = options.slice();
    if (extra && extra !== '' && values.indexOf(extra) === -1) values.push(extra);
    var html = '<option value="">' + esc(placeholder) + '</option>';
    values.forEach(function (v) {
      html += '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(v) + '</option>';
    });
    select.innerHTML = html;
  }

  function fillFilterSelects() {
    fillSelect($('filter-category'), state.categories, 'Все категории', $('filter-category').value);
    fillSelect($('filter-status'), state.statuses, 'Все статусы', $('filter-status').value);
  }

  /* ---------- Оценка клиента (звёзды) ---------- */

  /** Подсвечивает первые N звёзд согласно значению скрытого поля. */
  function paintStars(value) {
    var v = parseInt(value, 10) || 0;
    var stars = document.querySelectorAll('#like-stars .star-btn');
    for (var i = 0; i < stars.length; i++) {
      stars[i].classList.toggle('on', Number(stars[i].getAttribute('data-value')) <= v);
    }
  }

  function onStarsClick(e) {
    var btn = e.target.closest('.star-btn');
    if (!btn) return;
    var val = btn.getAttribute('data-value');
    // повторный клик по той же звезде снимает оценку
    $('f-like').value = ($('f-like').value === val) ? '' : val;
    paintStars($('f-like').value);
  }

  /* ---------- Модальное окно клиента ---------- */

  function openClientModal(client) {
    var isEdit = !!client;

    $('modal-title').textContent = isEdit ? 'Карточка клиента' : 'Новый клиент';
    $('f-id').value = isEdit ? client.id : '';

    $('f-name').value = isEdit ? (client.name || '') : '';
    $('f-ig-username').value = isEdit ? (client.igUsername || '') : '';
    $('f-ig-link').value = isEdit ? (client.igLink || '') : '';
    $('f-phone').value = isEdit ? (client.phone || '') : '';
    $('f-email').value = isEdit ? (client.email || '') : '';
    $('f-city').value = isEdit ? (client.city || '') : '';
    $('f-bio').value = isEdit ? (client.bio || '') : '';
    $('f-avatar').value = isEdit ? (client.avatar || '') : '';
    $('f-notes').value = isEdit ? (client.notes || '') : '';

    $('f-like').value = isEdit ? (client.likeLevel || '') : '';
    paintStars($('f-like').value);
    $('f-money').value = isEdit ? (client.sessionMoney || '') : '';
    $('f-tattoos').value = isEdit ? (client.tattooCount || '') : '';

    fillSelect($('f-category'), state.categories, '— не выбрано —',
      isEdit && client.category ? client.category : '', isEdit ? client.category : '');
    fillSelect($('f-status'), state.statuses, '— не выбрано —',
      isEdit && client.status ? client.status : '', isEdit ? client.status : '');

    $('f-dates').classList.toggle('hidden', !isEdit);
    if (isEdit) {
      $('f-dates').textContent = 'Добавлен: ' + (client.created || '—') +
        (client.updated ? ' · Изменён: ' + client.updated : '');
    }

    $('btn-delete').classList.toggle('hidden', !isEdit);
    $('comments-section').classList.toggle('hidden', !isEdit);

    hideIgStatus();
    $('ig-input').value = isEdit && client.igUsername ? (client.igLink || client.igUsername) : '';
    updateAvatarPreview();

    if (isEdit) {
      commentsClientId = client.id;
      $('comments-list').innerHTML = '';
      $('comments-empty').classList.add('hidden');
      $('comments-count').textContent = '0';
      loadComments(client.id);
    } else {
      commentsClientId = null;
    }

    openOverlay();
  }

  function openOverlay() {
    $('modal-client').classList.remove('hidden');
    document.body.classList.add('modal-open');
  }

  function closeOverlay() {
    $('modal-client').classList.add('hidden');
    document.body.classList.remove('modal-open');
  }

  /* ---------- Предпросмотр аватара ---------- */

  function updateAvatarPreview() {
    var wrap = $('f-avatar-wrap');
    var img = wrap.querySelector('img');
    var src = $('f-avatar').value.trim();

    if (src) {
      if (!img) {
        img = document.createElement('img');
        img.alt = '';
        img.onerror = function () { img.remove(); };
        wrap.appendChild(img);
      }
      img.src = src;
    } else if (img) {
      img.remove();
    }

    var name = $('f-name').value.trim() || $('f-ig-username').value.trim() || '?';
    wrap.setAttribute('data-letter', name.charAt(0).toUpperCase());
  }

  /* ---------- Автозаполнение из Instagram ---------- */

  function hideIgStatus() {
    $('ig-status').classList.add('hidden');
    $('ig-status').className = 'ig-status hidden';
  }

  function showIgStatus(text, type) {
    var el = $('ig-status');
    el.textContent = text;
    el.className = 'ig-status ' + type;
  }

  function fetchIg() {
    var input = $('ig-input').value.trim();
    hideIgStatus();
    if (!input) {
      showIgStatus('Введите ссылку на профиль Instagram или ник.', 'error');
      return;
    }
    var btn = $('btn-ig-fetch');
    btn.disabled = true;
    btn.textContent = 'Получаю…';

    callServer('fetchInstagramData', input).then(function (res) {
      if (!res || !res.ok) {
        showIgStatus(res && res.error ? res.error : 'Не удалось получить данные. Попробуйте ещё раз.', 'error');
        return;
      }
      var d = res.data || {};
      if (d.username) $('f-ig-username').value = d.username;
      if (d.igLink) $('f-ig-link').value = d.igLink;
      if (d.avatar) $('f-avatar').value = d.avatar;
      if (d.bio) $('f-bio').value = d.bio;
      // имя не перезаписываем, если уже введено вручную
      if (d.fullName && !$('f-name').value.trim()) $('f-name').value = d.fullName;
      updateAvatarPreview();

      if (res.partial) {
        showIgStatus(res.warning || 'Instagram не отдал данные профиля — заполните поля вручную.', 'warn');
      } else {
        showIgStatus('Данные профиля получены и подставлены в форму.', 'ok');
      }
    }).catch(function (err) {
      showIgStatus('Ошибка запроса: ' + err.message, 'error');
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = 'Получить данные';
    });
  }

  /* ---------- Сохранение и удаление ---------- */

  function saveFromForm() {
    var client = {
      id: $('f-id').value,
      name: $('f-name').value.trim(),
      igUsername: $('f-ig-username').value.trim(),
      igLink: $('f-ig-link').value.trim(),
      avatar: $('f-avatar').value.trim(),
      bio: $('f-bio').value.trim(),
      phone: $('f-phone').value.trim(),
      email: $('f-email').value.trim(),
      category: $('f-category').value,
      status: $('f-status').value,
      city: $('f-city').value.trim(),
      notes: $('f-notes').value.trim(),
      likeLevel: $('f-like').value,
      sessionMoney: $('f-money').value.trim(),
      tattooCount: $('f-tattoos').value.trim()
    };
    if (!client.name && !client.igUsername) {
      toast('Укажите хотя бы имя или Instagram-ник клиента', 'error');
      return;
    }
    var btn = $('btn-save');
    btn.disabled = true;
    btn.textContent = 'Сохраняю…';
    callServer('saveClient', client).then(function () {
      return reload().then(function () {
        toast('Клиент сохранён', 'ok');
        closeOverlay();
      });
    }).catch(function (err) {
      toast('Не удалось сохранить: ' + err.message, 'error');
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = 'Сохранить';
    });
  }

  function deleteCurrent() {
    var id = $('f-id').value;
    if (!id) return;
    if (!window.confirm('Удалить клиента вместе со всеми его комментариями? Действие необратимо.')) return;
    callServer('deleteClient', id).then(function () {
      return reload().then(function () {
        toast('Клиент удалён', 'ok');
        closeOverlay();
      });
    }).catch(function (err) {
      toast('Не удалось удалить: ' + err.message, 'error');
    });
  }

  /* ---------- Комментарии ---------- */

  function loadComments(id) {
    callServer('getComments', id).then(renderComments).catch(function () {
      // список комментариев не критичен — молча оставляем пустым
    });
  }

  function renderComments(list) {
    var box = $('comments-list');
    if (!list || !list.length) {
      box.innerHTML = '';
      $('comments-empty').classList.remove('hidden');
      $('comments-count').textContent = '0';
      return;
    }
    $('comments-empty').classList.add('hidden');
    $('comments-count').textContent = String(list.length);
    box.innerHTML = list.map(function (c) {
      var who = c.author ? ' · ' + esc(c.author) : '';
      return '<div class="comment">' +
        '<div class="comment-meta">' + esc(c.created) + who + '</div>' +
        '<div class="comment-text">' + esc(c.text) + '</div>' +
      '</div>';
    }).join('');
  }

  function submitComment() {
    var text = $('f-comment').value.trim();
    if (!text || !commentsClientId) return;
    var btn = $('btn-add-comment');
    btn.disabled = true;
    callServer('addComment', commentsClientId, text).then(function (list) {
      $('f-comment').value = '';
      renderComments(list);
    }).catch(function (err) {
      toast('Не удалось добавить комментарий: ' + err.message, 'error');
    }).finally(function () {
      btn.disabled = false;
    });
  }

  /* ---------- Экспорт в Excel ---------- */

  function exportXlsx() {
    var btn = $('btn-export');
    btn.disabled = true;
    toast('Готовлю Excel-файл…');
    callServer('exportXlsx').then(function (res) {
      downloadBase64(res);
      toast('Файл «' + res.fileName + '» скачан', 'ok');
    }).catch(function (err) {
      toast('Не удалось выгрузить базу: ' + err.message, 'error');
    }).finally(function () {
      btn.disabled = false;
    });
  }

  function downloadBase64(res) {
    var bin = atob(res.base64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = res.fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(url);
      a.remove();
    }, 2000);
  }

  /* ---------- Инициализация ---------- */

  document.addEventListener('DOMContentLoaded', function () {
    $('btn-add').addEventListener('click', function () { openClientModal(null); });
    $('cards').addEventListener('click', onCardsClick);
    $('btn-save').addEventListener('click', saveFromForm);
    $('btn-delete').addEventListener('click', deleteCurrent);
    $('btn-ig-fetch').addEventListener('click', fetchIg);
    $('btn-export').addEventListener('click', exportXlsx);
    $('btn-add-comment').addEventListener('click', submitComment);

    $('search').addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderCards, 150);
    });
    $('filter-category').addEventListener('change', renderCards);
    $('filter-status').addEventListener('change', renderCards);

    ['f-name', 'f-ig-username', 'f-avatar'].forEach(function (id) {
      $(id).addEventListener('input', updateAvatarPreview);
    });

    $('like-stars').addEventListener('click', onStarsClick);
    $('like-clear').addEventListener('click', function () {
      $('f-like').value = '';
      paintStars('');
    });

    var closers = document.querySelectorAll('[data-close]');
    for (var i = 0; i < closers.length; i++) {
      closers[i].addEventListener('click', closeOverlay);
    }
    $('modal-client').addEventListener('click', function (e) {
      if (e.target === this) closeOverlay();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeOverlay();
    });

    reload().then(function () {
      $('loading').classList.add('hidden');
    }).catch(function (err) {
      $('loading').classList.add('hidden');
      showEmpty('Не удалось загрузить данные: ' + esc(err.message) + '<br>Обновите страницу и попробуйте ещё раз.');
    });
  });
})();
</script>
