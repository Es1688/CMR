name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests (tests/*.test.js)
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
